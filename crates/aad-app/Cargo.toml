[package]
name = "aad-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The AiAidedDesign app: holds the design and takes Claude's proposals (window comes in phase 4)."

[[bin]]
name = "AiAidedDesign"
path = "src/main.rs"

[dependencies]
aad-model = { path = "../aad-model" }
aad-kernel = { path = "../aad-kernel" }
aad-export = { path = "../aad-export" }
aad-link = { path = "../aad-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
