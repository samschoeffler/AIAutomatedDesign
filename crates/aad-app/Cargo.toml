[package]
name = "aad-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The AiAidedDesign app: a window with the 3D part, the feature list and Claude's proposals."

[[bin]]
name = "AiAidedDesign"
path = "src/main.rs"

[dependencies]
aad-model = { path = "../aad-model" }
aad-kernel = { path = "../aad-kernel" }
aad-export = { path = "../aad-export" }
aad-link = { path = "../aad-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The window: eframe runs egui (buttons, panels) on wgpu (the GPU), which also draws the part.
eframe = "0.37"
# Lets us copy vertex structs straight into GPU buffers.
bytemuck = { version = "1.25", features = ["derive"] }
# Vectors and matrices for the 3D camera.
glam = "0.34"
# The render tool: pictures for Claude are PNG files, sent as base64 text.
png = "0.18.1"
base64 = "0.23.1"
# Waits for the GPU to be set up (wgpu does that asynchronously).
pollster = "1.0.1"
